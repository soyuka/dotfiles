# One-Dark, ported from ~/.config/alacritty/color.black.toml (0x-prefixed -> bare hex).
[colors-dark]
background=282c34
foreground=abb2bf

regular0=5c6370
regular1=e06c75
regular2=98c379
regular3=d19a66
regular4=61afef
regular5=c678dd
regular6=56b6c2
regular7=abb2bf

bright0=7f848e
bright1=be5046
bright2=98c379
bright3=e5c07b
bright4=61afef
bright5=c678dd
bright6=56b6c2
bright7=dcdfe4

# bright0/bright7 deviate from the alacritty-era port (bright0=4b5263, bright7=3e4452, see
# ~/.config/alacritty/color.black.toml) — those were One Dark's *UI* greys (visual selection /
# cursor line), not ANSI bright colors. With foot.ini's bold-text-in-bright=palette-based, any
# color byte-identical to a regular0-7 entry is swapped for its bright counterpart; foreground
# (abb2bf) == regular7, so ALL bold text was rendered in bright7 — 1.44:1 contrast on the 282c34
# background, vs 6.57:1 for plain text. Unreadable. Same for bold ANSI black: bright0 was darker
# than regular0 (1.79:1). bright7=dcdfe4 (One Dark's light foreground) -> 10.48:1, clearly
# above plain text's 6.57:1 without pure white's glare; bright0=7f848e (One Dark light grey,
# kept above regular0=5c6370) -> 3.73:1.
# regular3/bright3 were also inverted vs upstream One Dark; restored to upstream order
# (yellow=d19a66 5.68:1, bright yellow=e5c07b 8.10:1).
# Invariant: every brightN must be lighter than its regularN.

# order: <text under cursor> <cursor itself>
cursor=5c6370 abb2bf

alpha=1.0
