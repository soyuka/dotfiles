################
# Key Bindings #
################

# Global prefix
unbind C-b
set -g prefix C-a
bind-key C-a send-prefix

# reset the behavior of C-Left and C-Right
unbind-key -n C-Left
unbind-key -n C-Right

# Smart pane switching with awareness of vim splits
bind -n C-h run "(tmux display-message -p '#{pane_current_command}' | grep -iqE '(^|\/)g?(view|n?vim?)(diff)?$' && tmux send-keys C-h) || tmux select-pane -L"
bind -n C-j run "(tmux display-message -p '#{pane_current_command}' | grep -iqE '(^|\/)g?(view|n?vim?)(diff)?$' && tmux send-keys C-j) || tmux select-pane -D"
bind -n C-k run "(tmux display-message -p '#{pane_current_command}' | grep -iqE '(^|\/)g?(view|n?vim?)(diff)?$' && tmux send-keys C-k) || tmux select-pane -U"
bind -n C-l run "(tmux display-message -p '#{pane_current_command}' | grep -iqE '(^|\/)g?(view|n?vim?)(diff)?$' && tmux send-keys C-l) || tmux select-pane -R"
bind -n C-\\ run "(tmux display-message -p '#{pane_current_command}' | grep -iqE '(^|\/)g?(view|n?vim?)(diff)?$' && tmux send-keys 'C-\\') || tmux select-pane -l"

# In copy mode the above didn't work see https://stackoverflow.com/questions/42202936/tmux-move-across-panels-with-vim-key-bindings-while-in-copy-mode
bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R
bind-key -T copy-mode-vi C-\\ select-pane -l

# Some vi selection keys

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'V' send -X rectangle-toggle
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel
#bind-key -T copy-mode-vi 'Y' send -X select-line

# window splitting
unbind %
bind | split-window -h -c '#{pane_current_path}'
unbind '"'
bind _ split-window -v -c '#{pane_current_path}'

# window resizing
bind < resize-pane -L 10
bind > resize-pane -R 10
bind - resize-pane -D 10
bind + resize-pane -U 10

##########
# Visual #
##########

# auto set window title
setw -g automatic-rename

#use 256 term + truecolor (Tc/RGB) on the outer terminal
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# foot replaced alacritty (2026-07-30) to get real images in the terminal. This tmux IS built with
# sixel support (`strings $(which tmux) | grep sixel`), but it only enables it for terminals that
# advertise it — alacritty never did, foot does. terminal-features matches the OUTER terminal's
# $TERM, so this must say foot*, and foot must keep TERM=foot (that is why the foot config does NOT
# reproduce alacritty's `TERM = "screen-256color"` override).
# Check it took effect: tmux info | grep -i sixel
# hyperlinks = OSC 8. Without it tmux strips the escape and clickable links arrive as plain text.
# extkeys/sync need tmux >= 3.7 (3.7b from the Arch repo since 2026-09-02, replaces the 2024 source build):
# sync = DEC 2026 synchronized updates, removes Claude Code fullscreen flicker;
# extkeys + extended-keys let Shift+Enter reach the app instead of collapsing to Enter.
set -as terminal-features ",foot*:RGB:sixel:hyperlinks:extkeys:sync"
set -s extended-keys on
# let apps send OSC sequences (notifications, progress bar) to foot through tmux
set -g allow-passthrough on

# increase scroll-back history
set -g history-limit 10000

# wheel scrolling (enters copy-mode automatically). Shift+drag still does foot's
# native selection, bypassing tmux.
set -g mouse on

# use vim key bindings
setw -g mode-keys vi

# forward focus in/out events to apps (fixes Claude Code cursor/redraw bugs on zoom/resize)
set -g focus-events on

# decrease command delay (increases vim responsiveness)
# address vim mode switching delay (http://superuser.com/a/252717/65504)
set -s escape-time 0

# tmux messages are displayed for 4 seconds
set -g display-time 4000

# increase repeat time for repeatable commands
set -g repeat-time 1000

# re-number windows when one is closed
set -g renumber-windows on

# allow ctrl+left/right for jump word
set-window-option -g xterm-keys on

# center statusbar
set -g status-justify left

# reset status bar more often
set-option -g status-interval 1

# Nothing when activity window it's annoying af
setw -g monitor-activity off
set -g visual-activity off

# clock
set-window-option -g clock-mode-colour cyan
set-window-option -g clock-mode-style 24

# windows format
set-window-option -g window-status-format " #I: #W "
set-window-option -g window-status-current-format " #I: #W "

# default statusbar colors
set -g status-style fg=white
set-window-option -g window-status-style fg=white
# Explicit hex, not fg=black,bg=white: `black` is palette 0, and foot's
# bold-text-in-bright=palette-based remapped that bold fg to bright0, so the chip's readability
# tracked whatever bright0 happened to be (7f848e -> 1.76:1). Hex opts out of the remap.
#
# The chip must contrast with the status bar, which is painted on the terminal background, so it
# cannot be one fixed color: #4b5263 reads 7.82:1 on the light scheme's f8f8f8 but only 1.44:1 on
# the dark scheme's 282c34, where the highlight disappears. Hence one background per theme.
# ~/.config/sway/scripts/switch_dark_mode.sh applies the same two values to a running server;
# this if-shell only seeds a newly started one. current_scheme holds black|white.
if-shell '[ "$(cat ~/.config/sway/current_scheme 2>/dev/null)" = "white" ]' \
    'set-window-option -g window-status-current-style fg=#ffffff,bg=#4b5263,bold' \
    'set-window-option -g window-status-current-style fg=#ffffff,bg=#5c6370,bold'
set -g message-style fg=white,bg=black

# left status
set -g status-left ''
set -g status-left-length 0

# set -g status-right '#[fg=blue]#(git -C #{pane_current_path} rev-parse --abbrev-ref HEAD) #[fg=white]#(whoami)@#h #[default]#[fg=blue,bold]#(tmux display-message -p "#{pane_current_path}" | sed "s#$HOME#~#g") '
# superseded 2026-09-02 by the Agent Strip block below, which prepends the
# any-agent-needs-you alarm to this exact string. Kept for reference:
# set -g status-right '#[fg=blue]#(git -C #{pane_current_path} rev-parse --abbrev-ref HEAD 2>/dev/null)#{?#(git -C #{pane_current_path} status --porcelain 2>/dev/null | wc -l | tr -d " \n" | grep -q "[1-9]") ,#[fg=red] ❌,}#[fg=white]#(whoami)@#h #[default]#[fg=blue,bold]#(tmux display-message -p "#{pane_current_path}" | sed "s#$HOME#~#g")'
# set -g pane-border-status bottom
# set -g pane-border-format ' #(git -C #{pane_current_path} rev-parse --abbrev-ref HEAD) #[fg=cyan]#{pane_current_path} '

set -g status-right-length 300

# Load tmux plugins manager
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-yank"
set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @plugin 'laktak/extrakto'
set -g @plugin "sainnhe/tmux-fzf"

set -g @resurrect-strategy-vim 'session'
# claude panes: full saved command is restored as-is; the post-save hook rewrites
# each claude pane to `claude --resume <session-id>` (pane->session map fed by the
# SessionStart hook in ~/.claude/hooks/tmux-pane-session.sh)
set -g @resurrect-processes 'ssh htop screenfetch vim "~claude"'
set -g @resurrect-hook-post-save-all '/home/soyuka/.local/bin/tmux-resurrect-claude-rewrite'

#################
# Agent Strip   #
#################

# tmux 3.7c natively renders a per-pane list on status line index 1 via
# status-format[1] (#{P:...}, list=on/list=focus) — verified against a live
# server with `tmux show -g status-format` 2026-09-02. `set -g status 2`
# switches the pane list on; we do NOT redefine status-format itself, only
# the two per-pane templates it plugs in (window-pane-status-format /
# ...-current-status-format). This is deliberately the status bar and not a
# sidebar pane: prefix+z zoom hides every OTHER pane in the window, but the
# status line survives zoom — #{P:...}/#{W:#{P:...}} still iterate panes
# hidden by zoom, so the strip stays visible and accurate zoomed or not.
#
# #() shell calls in tmux formats are async-cached and render BLANK on first
# eval — never used below. State instead comes from a per-pane user option
# (@agent_state) written synchronously by ~/.local/bin/claude-tmux-state via
# Claude Code hooks (see ~/.claude/settings.json) — zero subprocess cost in
# the format itself.
set -g status 2

# Guard: #{m:claude*,#{pane_current_command}} — non-Claude panes render an
# EMPTY entry (not a placeholder), so a killed agent's shell (which never
# fires SessionEnd) disappears from the strip on its own, no stale glyph
# left behind. #I.#{pane_index} (window.pane) matches this config's
# C-a <n> / C-h,j,k,l navigation, unlike the native default's bare #P.
set -g window-pane-status-format '#{?#{m:claude*,#{pane_current_command}},#{?#{==:#{@agent_state},perm},#[fg=red bold]!,#{?#{==:#{@agent_state},done},#[fg=yellow]●,#{?#{==:#{@agent_state},running},#[fg=green]…,#[fg=colour244]○}}} #{=/#{@agent_budget}/…:#{s/^✳ //:pane_title}},}'

# Same, reverse-video so the focused pane's entry stands out (native
# list=focus alone applies pane-status-current-style, which we're not
# setting — so the distinction is baked into the format text instead).
set -g window-pane-current-status-format '#{?#{m:claude*,#{pane_current_command}},#[reverse]#{?#{==:#{@agent_state},perm},#[fg=red bold]!,#{?#{==:#{@agent_state},done},#[fg=yellow]●,#{?#{==:#{@agent_state},running},#[fg=green]…,#[fg=colour244]○}}} #{=/#{@agent_budget}/…:#{s/^✳ //:pane_title}},}'

# "Any agent needs you" alarm on line 0 (status-right), for when the strip
# scrolls past ~8 agents and a red/yellow entry falls off the visible width.
# #{W:#{P:...}} loops ALL windows' panes (not just the current window), so
# an agent waiting in a background window still raises this. Prepended to
# the existing status-right — the git branch/dirty-state part after it is
# untouched, byte-for-byte, from the original line.
set -g status-right '#{?#{W:#{P:#{?#{==:#{@agent_state},perm},x,}}},#[fg=red]⚠ ,}#{?#{W:#{P:#{?#{==:#{@agent_state},done},x,}}},#[fg=yellow]⚠ ,}#[fg=blue]#(git -C #{pane_current_path} rev-parse --abbrev-ref HEAD 2>/dev/null)#{?#(git -C #{pane_current_path} status --porcelain 2>/dev/null | wc -l | tr -d " \n" | grep -q "[1-9]") ,#[fg=red] ❌,}#[fg=white]#(whoami)@#h #[default]#[fg=blue,bold]#(tmux display-message -p "#{pane_current_path}" | sed "s#$HOME#~#g")'

# No after-resize-pane zoom toggle: decision made 2026-09-02 that the strip
# stays always-on. Cross-window agent info is equally useful zoomed or not,
# and toggling status on every prefix+z would jump the layout underneath
# whatever's zoomed.
#
# `g` is free in the prefix table (checked ~/.tmux.conf: prefix bindings are
# C-a/|/_/</>/-/+ only; `g` is otherwise bound solely in copy-mode-vi).
# tmux's NATIVE status-format[1] iterates only the CURRENT window's panes
# (#{P:...}); verified 2026-09-03 it expanded to a single entry while three
# agents were running in other windows. The strip is meant to show every
# agent regardless of which window is focused — and regardless of zoom —
# so status-format[1] is replaced below with a #{W:#{P:...}} version.
# tmux's own list machinery is kept verbatim from the default (list=on,
# list=focus, the left/right overflow markers, range=pane for mouse): those
# are applied at DRAW time, not at format-expansion time, so they can't be
# verified with `display -p` — don't "fix" them based on an expansion dump.
# The default's leading `P: ` label is dropped.
set -g 'status-format[1]' '#[align=left]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#{P:#[range=pane|#{pane_id}]#[push-default]#{T:window-pane-status-format}#[pop-default]#[norange list=on default]  },#{P:#[range=pane|#{pane_id}]#[push-default]#{T:window-pane-status-format}#[pop-default]#[norange list=on default]  ,#[range=pane|#{pane_id} list=focus]#[push-default]#{T:window-pane-current-status-format}#[pop-default]#[norange list=on default]  }}'

# Per-entry title width. MUST come from an option, not from a format:
# computing it needs the Claude-pane count across all windows, i.e.
# #{n:#{W:#{P:...}}} — a nested pane loop. Evaluated inside the strip's own
# #{W:#{P:...}} loop, tmux's loop state is not re-entrant and the inner loop
# leaves the outer one pointing at the last pane: verified 2026-09-03 that
# pane %2 rendered as %5, giving 4 entries for 5 agents. An A/B with the only
# difference being option-vs-nested budget reproduced it exactly. So
# ~/.local/bin/tmux-agent-budget computes it out-of-loop and sets the option;
# 24 is only the value before the first refresh.
set -g @agent_budget 24
set-hook -g client-resized     'run-shell -b ~/.local/bin/tmux-agent-budget'
set-hook -g after-split-window 'run-shell -b ~/.local/bin/tmux-agent-budget'
set-hook -g after-new-window   'run-shell -b ~/.local/bin/tmux-agent-budget'
# No pane-exited hook: NOT a valid hook name in 3.7c (set-hook accepts it
# silently and it never persists — verified 2026-09-03 against
# `tmux show-hooks -g`). after-kill-pane is the real one; a pane whose
# process exits on its own is covered from the Claude side instead, by
# SessionEnd in ~/.local/bin/claude-tmux-state.
set-hook -g after-kill-pane    'run-shell -b ~/.local/bin/tmux-agent-budget'

bind g display-popup -E -w 80% -h 60% ~/.local/bin/claude-agent-switcher

run-shell ~/.tmux/plugins/tpm/tpm
