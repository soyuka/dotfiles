# Light scheme, ported from ~/.config/alacritty/color.white.toml.
# Section MUST stay [colors-light]: foot picks the section by theme, not by which file is included.
[colors-light]
background=f8f8f8
foreground=2a2b33

regular0=000000
regular1=de3d35
regular2=3e953a
regular3=986801
regular4=2f5af3
regular5=a00095
regular6=0184bc
regular7=767676

bright0=000000
bright1=de3d35
bright2=3e953a
bright3=986801
bright4=2f5af3
bright5=a00095
bright6=0184bc
bright7=767676

# bright7 was ffffff — invisible bold ANSI white (1.06:1) on the f8f8f8 background, and it broke
# this scheme's own rule that bright == regular. Now 767676, matching regular7.
#
# regular7/bright7 were bbbbbb — 1.81:1 on f8f8f8, so ANSI white text was invisible (tmux's
# `status-style fg=white` among others). Now 767676, the classic AA-on-white grey, 4.28:1. This
# trades the "white is light" semantic for readability: a TUI painting color 7 on a dark fill
# gets a mid grey instead of near-white. Upstream One Light's a0a1a7 keeps the semantic but is
# still only 2.43:1, i.e. still unreadable, which is why it is not used.
#
# regular6/bright6 were 3e953a — byte-identical to regular2, so cyan and green were the same
# color. Now 0184bc, upstream One Light's cyan, 3.93:1.
#
# regular3/bright3 were d2b67b — 1.84:1 on f8f8f8, unreadable. Now 986801, upstream One Light's
# yellow, 4.58:1 (clears WCAG AA). Upstream's bright yellow c18401 is NOT used: on a light
# background a "brighter" color means less contrast (3.01:1), which is the bug being fixed here,
# so bright3 keeps this scheme's bright == regular rule instead.

cursor=f8f8f8 2a2b33

alpha=1.0
