# Both palettes are always loaded; foot picks one by theme, not by which file is included.
# The old alacritty-era include-swap is gone: foot never re-reads its config, so rewriting
# this line had no effect on running windows.
include=/home/soyuka/.config/foot/color.black.ini
include=/home/soyuka/.config/foot/color.white.ini

# Ported from alacritty.toml (2026-07-30). Deliberately NOT ported: alacritty's `[env] TERM =
# "screen-256color"`. Forcing that would hide foot's own capabilities from tmux, and sixel support
# is the whole reason for the switch — tmux matches `terminal-features` against the OUTER TERM, so
# it must stay "foot". The foot terminfo ships with ncurses, so nothing else needs installing.
font=SauceCodePro Nerd Font:size=12
font-bold=SauceCodePro Nerd Font:style=Bold:size=12
font-italic=SauceCodePro Nerd Font:style=Italic:size=12

# Rewritten by ~/.config/sway/scripts/switch_dark_mode.sh so new windows open in the theme the
# running ones were just switched to. Keep the key on its own line, value dark|light.
initial-color-theme=dark

# Ports alacritty's `draw_bold_text_with_bright_colors = true` (alacritty.toml:9).
# palette-based, not yes: alacritty remapped a bold regular0-7 to the matching bright0-7,
# which is what palette-based does. Plain `yes` instead blends toward white by 1.3x — that
# would wash out the light scheme, whose bright colors are identical to its regular ones.
bold-text-in-bright=palette-based

pad=2x2
initial-window-size-chars=80x24

# alacritty's ~100 keyboard.bindings entries are NOT ported: almost all of them re-declared the
# default xterm sequences (arrows, F1-F12, PageUp/Down, Home/End) that foot already emits, and the
# few real ones — Ctrl+Shift+C/V, Ctrl+plus/minus/0 for font size, middle-click paste — are foot
# defaults too. Porting them verbatim would only create drift.

[cursor]
blink=no

[mouse]
hide-when-typing=yes

